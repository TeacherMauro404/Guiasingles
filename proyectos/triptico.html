<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tríptico de predicciones · Inglés 2° Medio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Plantilla para generar los PDF del proyecto "Tríptico de predicciones" (will).
  Modos (?modo=): guia | plantilla | pauta.  Generar con: node generador/generar_triptico.js
-->
<style>
  :root{--navy:#0E2A47;--bar:#1E5A8A;--blue:#1F5C8B;--blue-soft:#EEF4FA;--gold:#C8912B;--gold-soft:#FBF4E4;
    --ink:#152230;--muted:#5A6B7A;--line:#B8C7D6;--ans:#C0392B;--green:#1B7A3D}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:11.5px;line-height:1.45;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .hdr{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:7px 11px}
  .hdr b{font-size:12.5px;display:block}.hdr small{font-size:9px;color:#c8d7e6}
  .hdr .r{text-align:right}.hdr .r b{color:#E9C579;font-size:11px}
  body.pauta .hdr{background:#5b3f0d}
  .flag{background:var(--ans);color:#fff;font-weight:700;font-size:10.5px;text-align:center;padding:3px;letter-spacing:.05em}
  .namebox{display:grid;grid-template-columns:1.4fr 1fr;border:1.2px solid var(--navy);margin-top:7px;font-size:11px}
  .namebox div{padding:7px 9px}.namebox div+div{border-left:1px solid var(--line)}
  h1{font-family:'Fraunces',Georgia,serif;color:var(--navy);font-size:25px;margin:9px 0 2px;line-height:1.1}
  .obj{color:var(--green);font-weight:700;font-size:10.5px;margin:0}
  .goal{color:var(--blue);font-style:italic;font-size:10.5px;margin:0 0 7px}
  .box{background:var(--gold-soft);border:1px solid var(--gold);padding:7px 10px;margin:6px 0}
  .box h3{margin:0 0 3px;font-size:11.5px;color:var(--navy)}
  .box p{margin:2px 0}
  .act{margin-top:9px;break-inside:avoid;page-break-inside:avoid}
  .bar{background:var(--bar);color:#fff;font-weight:700;font-size:11.5px;padding:4px 9px;display:flex;justify-content:space-between}
  .bar span{font-weight:500;color:#cfe0ef}
  .instr{font-style:italic;font-size:10.3px;color:var(--muted);margin:3px 0 5px}
  table.t{border-collapse:collapse;width:100%}
  table.t td,table.t th{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
  table.t th{background:var(--blue-soft);color:var(--navy);font-size:10.5px}
  .ln{border-bottom:1px solid var(--ink);height:19px}
  .a{color:var(--ans);font-weight:700}
  ol.items{margin:0;padding-left:20px}ol.items li{margin-bottom:5px}
  .scale{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:10.5px;border:1px solid var(--line)}
  .scale div{padding:5px 3px;border-right:1px solid var(--line)}
  .scale div:last-child{border-right:none}
  .scale b{display:block;font-size:13px;color:var(--navy)}
  .bank{background:var(--gold-soft);border:1px solid var(--gold);text-align:center;font-weight:700;color:var(--navy);padding:4px;margin-bottom:5px}
  .diagram{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .fold{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--navy);height:70px}
  .fold div{border-right:1.5px dashed var(--muted);padding:4px;font-size:9.5px;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .fold div:last-child{border-right:none}
  .fold div b{color:var(--navy);font-size:10px}
  .cap{font-size:10px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .model{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--navy)}
  .model > div{padding:7px 8px;border-right:1.5px dashed var(--muted);font-size:10.3px;line-height:1.4}
  .model > div:last-child{border-right:none}
  .model h4{margin:0 0 3px;font-family:'Fraunces',serif;color:var(--navy);font-size:12.5px}
  .model .tag{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
  .check li{list-style:none;margin:3px 0}
  .check li::before{content:"☐  ";font-size:12px}
  .foot{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:3px}

  /* ---------- plantilla horizontal ---------- */
  body.plantilla{font-size:10.5px}
  .tri{display:grid;grid-template-columns:repeat(3,1fr);height:7.6in;border:1px solid #c9d4df}
  .panel{border-right:1.4px dashed #9aa9b8;padding:10px 12px;display:flex;flex-direction:column;position:relative}
  .panel:last-child{border-right:none}
  .panel .pn{position:absolute;top:4px;right:6px;font-size:8px;color:#9aa9b8;font-weight:600}
  .panel .lbl{font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
  .panel .ttl{border-bottom:2px solid var(--navy);height:26px;margin-bottom:6px;font-size:9px;color:#9aa9b8;display:flex;align-items:flex-end}
  .panel .draw{border:1.2px dashed #b5c3d1;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#a5b4c3;font-size:9px;margin:6px 0}
  .panel .lines{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
  .panel .lines div{border-bottom:1px solid #b5c3d1;height:21px;flex:0 0 21px}
  .panel .hint{font-size:8.5px;color:#a5b4c3;margin:0 0 2px;font-style:italic}
  .cover-title{font-family:'Fraunces',serif;font-size:26px;color:var(--navy);text-align:center;margin-top:6px;line-height:1.1}
  .cover-sub{text-align:center;color:var(--muted);font-size:10px;margin:4px 0}
  .tri-cap{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px}
  .tri-cap b{color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const modo=new URLSearchParams(location.search).get("modo")||"guia";
document.body.classList.add(modo);
const K=modo==="pauta";
const hdr=(label,page,total)=>`<div class="hdr"><div><b>INSTITUTO MARÍTIMO DE VALPARAÍSO</b><small>Departamento de Inglés · English Department</small></div>
  <div class="r"><b>${label}</b><small>2° Medio · Nivel A2 · Página ${page}/${total}</small></div></div>${K?'<div class="flag">PAUTA DE CORRECCIÓN — USO EXCLUSIVO DEL DOCENTE</div>':''}`;
const foot=`<div class="foot"><span>Proyecto: Tríptico de predicciones (will)</span><span>Tiempo sugerido: 3 clases de 45 minutos</span></div>`;
const lines=n=>Array.from({length:n},()=>'<div class="ln"></div>').join("");
const ans=(t)=>K?`<span class="a">${t}</span>`:"";

/* ---------- contenido controlado ---------- */
const adverbs=[
 ["People will live on the Moon. (probably)","People will probably live on the Moon."],
 ["Cars will use petrol. (definitely – negative)","Cars definitely won't use petrol."],
 ["Students will study at home. (probably)","Students will probably study at home."],
 ["Robots will cook our food. (definitely)","Robots will definitely cook our food."],
 ["Ships will need a captain on board. (probably – negative)","Ships probably won't need a captain on board."],
 ["I will be famous. (definitely – negative)","I definitely won't be famous."],
];
const complete=[
 ["In 2050, people [will travel] (travel) in electric planes.","will travel"],
 ["I think the sea [will be] (be) cleaner.","will be"],
 ["Students [won't use] (not use) paper books.","won't use"],
 ["Robots [will help] (help) old people at home.","will help"],
 ["I don't think people [will drive] (drive) petrol cars.","will drive"],
 ["My city [will have] (have) more parks and trees.","will have"],
 ["[Will] we live on Mars? — Yes, we [will].","Will · will"],
 ["Summers [will probably be] (probably / be) hotter.","will probably be"],
];
const blank=s=>s.replace(/\[([^\]]+)\]/g,(m,a)=>K?`<span class="a"><u>${a}</u></span>`:"__________");

const RUBRICA=[
 ["Contenido","3 temas completos con 3 o más predicciones cada uno, relevantes e interesantes.","3 temas con 2 predicciones cada uno.","2 temas o predicciones muy breves.","1 tema o contenido incompleto."],
 ["Uso de will / won't","Usa will, won't, preguntas y adverbios (probably, definitely) correctamente en casi todas las oraciones.","Usa will y won't correctamente con algunos errores menores.","Errores frecuentes que a veces dificultan la comprensión.","No usa will o los errores impiden comprender."],
 ["Vocabulario y ortografía","Vocabulario variado del tema; casi sin errores de ortografía.","Vocabulario adecuado; algunos errores.","Vocabulario limitado; varios errores.","Vocabulario muy pobre; muchos errores."],
 ["Estructura del tríptico","Los 6 paneles completos y en el orden correcto (portada, temas, sobre mí, contraportada).","5 paneles completos.","4 paneles completos o desordenados.","3 o menos paneles."],
 ["Diseño y creatividad","Portada atractiva, títulos claros, dibujos o imágenes en todos los temas, letra legible.","Diseño ordenado con algunas imágenes.","Diseño simple, pocas imágenes.","Desordenado o poco legible."],
];
const rubricaHTML=`<table class="t"><tr><th style="width:17%">Criterio</th><th>Excelente (4)</th><th>Bueno (3)</th><th>Suficiente (2)</th><th>Insuficiente (1)</th></tr>
 ${RUBRICA.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
 <tr><td colspan="5" style="text-align:right"><b>PUNTAJE PROYECTO: _______ / 20</b></td></tr></table>`;

function guia(){
  const p1=`<section class="sheet">${hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",1,5)}
  ${K?"":`<div class="namebox"><div><b>NOMBRE:</b> ______________________________</div><div><b>CURSO:</b> ______ <b>FECHA:</b> ________</div></div>`}
  <h1>My Predictions Tri-fold</h1>
  <p class="obj">Objetivo: crear un tríptico en inglés con predicciones sobre el futuro usando will / won't.</p>
  <p class="goal">Goal: make a tri-fold brochure with your predictions for the future.</p>
  <div class="box"><h3>PARA RECORDAR — Remember</h3>
    <p><b>will + verbo base</b>: <i>Robots <b>will</b> clean our houses.</i> · <b>won't</b> (will not): <i>People <b>won't</b> use cash.</i> · <b>Will</b> + sujeto + verbo?: <i><b>Will</b> we live on Mars?</i></p>
    <p>Opinión: <i><b>I think</b> … will … · <b>I don't think</b> … will …</i> (no: <i>I think … won't</i>) · Tiempo: <i>in 2050, in ten years, in the future, one day, soon</i></p>
    <p>Adverbios: <b>will probably / will definitely</b> (después de will) · <b>probably won't / definitely won't</b> (antes de won't)</p>
  </div>
  <div class="act"><div class="bar">¿QUÉ ES UN TRÍPTICO? · How does it work? <span>Lee con atención</span></div>
    <p class="instr">Un tríptico es una hoja tamaño carta horizontal doblada en tres partes. Tiene 6 paneles: 3 por fuera y 3 por dentro. Al final de este proyecto recibirás una plantilla para completar.</p>
    <div class="diagram">
      <div><div class="cap">OUTSIDE (por fuera)</div><div class="fold"><div><b>Panel 5</b>Me in 2050</div><div><b>Panel 6</b>Back cover: questions + author</div><div><b>Panel 1</b>Front cover: title + picture</div></div></div>
      <div><div class="cap">INSIDE (por dentro)</div><div class="fold"><div><b>Panel 2</b>Topic 1</div><div><b>Panel 3</b>Topic 2</div><div><b>Panel 4</b>Topic 3</div></div></div>
    </div>
  </div>
  <div class="act"><div class="bar">1 · WARM-UP: WHAT DO YOU THINK? <span>⏱ 8 min</span></div>
    <p class="instr">Lee cada predicción. Marca ✓ si estás de acuerdo o ✗ si no. Luego escribe tu opinión con I think … will / I don't think … will.</p>
    <table class="t"><tr><th style="width:50%">Prediction for 2050</th><th style="width:7%">✓ / ✗</th><th>My opinion</th></tr>
      ${["Robots will be teachers.","People will live on Mars.","Nobody will use cash.","Ships won't need sailors.","The sea will be cleaner.","Chile will win the World Cup."].map(s=>`<tr><td>${s}</td><td></td><td>${K?'<span class="a" style="font-weight:600">Respuesta personal (I think / I don\'t think … will …)</span>':""}</td></tr>`).join("")}</table>
  </div>
  ${foot}</section>`;

  const p2=`<section class="sheet">${hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",2,5)}
  <div class="act"><div class="bar">2 · HOW SURE ARE YOU? <span>⏱ 8 min · 6 pts</span></div>
    <div class="scale"><div><b>100%</b>will definitely</div><div><b>75%</b>will probably</div><div><b>25%</b>probably won't</div><div><b>0%</b>definitely won't</div></div>
    <p class="instr">Reescribe la oración con el adverbio entre paréntesis en la posición correcta.</p>
    <ol class="items">${adverbs.map(a=>`<li>${a[0]}<br>→ ${K?`<span class="a">${a[1]}</span>`:"_______________________________________________________________"}</li>`).join("")}</ol>
  </div>
  <div class="act"><div class="bar">3 · COMPLETE THE PREDICTIONS <span>⏱ 7 min · 8 pts</span></div>
    <p class="instr">Completa con will / won't + el verbo entre paréntesis.</p>
    <ol class="items" style="columns:2;column-gap:22px">${complete.map(c=>`<li style="break-inside:avoid">${blank(c[0])}</li>`).join("")}</ol>
  </div>
  ${foot}</section>`;

  const p3=`<section class="sheet">${hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",3,5)}
  <div class="act"><div class="bar">4 · READ A MODEL TRI-FOLD <span>⏱ 10 min · 6 pts</span></div>
    <p class="instr">Lee el tríptico de Martina (panel por panel) y responde.</p>
    <div class="model">
      <div><span class="tag">Panel 1 · Cover</span><h4>Valparaíso in 2050</h4>My predictions for the future of my city.<br><i>by Martina Rojas, 2°B</i></div>
      <div><span class="tag">Panel 2 · Technology</span><h4>Smart homes</h4>In 2050, I think everybody will have a personal robot. Robots will clean our houses and they will cook dinner. Phones probably won't exist; we will use smart glasses.</div>
      <div><span class="tag">Panel 3 · Transport &amp; the port</span><h4>Clean ships</h4>Ships will use clean energy like wind and hydrogen. The port will be bigger and the cranes will be automatic. I don't think people will drive cars in the city; they will use electric trams.</div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 4 · Environment</span><h4>A blue ocean</h4>The sea will be cleaner because people will recycle more. Plastic bags definitely won't exist. But summers will probably be hotter.</div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 5 · Me in 2050</span><h4>My future</h4>I will be 40 years old. I will probably work as a marine engineer. I will live near the sea with my family and two dogs.</div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 6 · Back cover</span><h4>What do YOU think?</h4>Will robots be our friends? Will you live in Valparaíso? Write your own predictions!<br><i>Instituto Marítimo de Valparaíso</i></div>
    </div>
    <p style="margin:6px 0 3px"><b>A.</b> Write T (true) or F (false).</p>
    <ol class="items">
      <li>Martina thinks phones will exist in 2050. ____ ${ans("F")}</li>
      <li>Ships will use clean energy. ____ ${ans("T")}</li>
      <li>She thinks plastic bags will exist. ____ ${ans("F")}</li>
      <li>She will probably be a marine engineer. ____ ${ans("T")}</li>
    </ol>
    <p style="margin:4px 0 3px"><b>B.</b> Answer the questions.</p>
    <ol class="items">
      <li>What will robots do? → ${K?ans("They will clean our houses and cook dinner."):"_____________________________________________________"}</li>
      <li>Why will the sea be cleaner? → ${K?ans("Because people will recycle more."):"_____________________________________________________"}</li>
    </ol>
  </div>
  <div class="act"><div class="bar">5 · PLAN YOUR TRI-FOLD <span>⏱ 15 min</span></div>
    <p class="instr">Elige 3 temas para los paneles 2, 3 y 4 y escribe ideas de predicciones. Ideas de temas: technology · transport · school · the environment · jobs · the sea and ports · my city · sports · food · space · health · free time.</p>
    <table class="t"><tr><th style="width:24%">Topic</th><th>Predictions with will (✓)</th><th>Predictions with won't (✗)</th></tr>
      ${["Panel 2:","Panel 3:","Panel 4:"].map(p=>`<tr><td style="height:54px"><b>${p}</b></td><td>${K?'<span class="a" style="font-weight:600">Respuesta personal</span>':""}</td><td></td></tr>`).join("")}
      <tr><td style="height:40px"><b>Panel 5:</b> Me in 2050</td><td></td><td></td></tr></table>
  </div>
  ${foot}</section>`;

  const p4=`<section class="sheet">${hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",4,5)}
  <div class="act"><div class="bar">6 · WRITE YOUR DRAFT <span>⏱ 20 min</span></div>
    <p class="instr">Escribe el borrador de cada panel (3–4 oraciones por panel). Usa I think, probably, definitely y al menos una pregunta con Will…? Revisa con tu profesor antes de pasarlo a la plantilla.</p>
    ${K?`<div class="box"><h3>Orientaciones para revisar el borrador</h3>
      <p>• Cada panel de tema debe tener un título y 3–4 oraciones con will / won't.</p>
      <p>• Verificar: will + verbo base (no <i>will goes</i>, <i>will to go</i>); <i>I don't think … will</i> (no <i>I think … won't</i>); posición del adverbio (<i>will probably</i> / <i>probably won't</i>).</p>
      <p>• Panel 6 debe incluir al menos una pregunta con Will…? y el nombre del autor.</p>
      <p>• Errores frecuentes: <i>In 2050 people will can…</i> → <i>will be able to…</i>; <i>Will there be…?</i> es correcto; <i>There will be</i> (no <i>There will have</i>).</p></div>`:""}
    <table class="t">
      <tr><td style="width:24%"><b>Panel 1 · Cover</b><br><span style="color:var(--muted)">Title + your name</span></td><td>${lines(2)}</td></tr>
      <tr><td><b>Panel 2</b><br>Topic: ___________</td><td>${lines(4)}</td></tr>
      <tr><td><b>Panel 3</b><br>Topic: ___________</td><td>${lines(4)}</td></tr>
      <tr><td><b>Panel 4</b><br>Topic: ___________</td><td>${lines(4)}</td></tr>
      <tr><td><b>Panel 5 · Me in 2050</b></td><td>${lines(3)}</td></tr>
      <tr><td><b>Panel 6 · Back cover</b><br><span style="color:var(--muted)">Questions for the reader</span></td><td>${lines(2)}</td></tr>
    </table>
  </div>
  ${foot}</section>`;

  const p5=`<section class="sheet">${hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",5,5)}
  <div class="act"><div class="bar">7 · CHECKLIST + RUBRIC <span>Antes de entregar</span></div>
    <ul class="check" style="padding-left:4px;columns:2;column-gap:20px;margin:4px 0 6px">
      <li>My cover has a title, my name and a picture.</li><li>I have 3 topics with 3+ predictions each.</li>
      <li>I used will + base verb (will live, not will lives).</li><li>I used won't at least 3 times.</li>
      <li>I used probably / definitely correctly.</li><li>I wrote at least one question with Will…?</li>
      <li>I checked my spelling and capital letters.</li><li>Every panel has a drawing or picture.</li>
    </ul>
    ${rubricaHTML}
  </div>
  ${foot}</section>`;
  return p1+p2+p3+p4+p5;
}

function plantilla(){
  const panel=(n,label,title,body)=>`<div class="panel"><span class="pn">Panel ${n}</span><div class="lbl">${label}</div>${body}</div>`;
  const topic=(n)=>panel(n,`Topic ${n-1}`,"",`<div class="ttl">Title:</div><div class="draw" style="height:1.45in">Draw a picture here</div><p class="hint">Write 3–4 predictions with will / won't.</p><div class="lines">${"<div></div>".repeat(10)}</div>`);
  const outside=`<section class="sheet"><div class="tri-cap"><span><b>OUTSIDE · Por fuera</b> — Imprime por ambos lados (voltear por el borde corto) y dobla por las líneas punteadas.</span><span>Tríptico de predicciones · 2° Medio</span></div>
   <div class="tri">
    ${panel(5,"Me in 2050","",`<div class="ttl">Title: My future</div><p class="hint">How old will you be? Where will you live? What will your job be?</p><div class="draw" style="height:1.3in">Draw yourself in 2050</div><div class="lines">${"<div></div>".repeat(10)}</div>`)}
    ${panel(6,"Back cover","",`<div class="ttl">Title: What do YOU think?</div><p class="hint">Write 2–3 questions with Will…? for your reader.</p><div class="lines" style="flex:0 0 auto">${"<div></div>".repeat(6)}</div><div class="draw" style="height:1.4in;margin-top:14px">Did you know…? / Fun fact</div><div style="margin-top:auto;font-size:9px;color:var(--muted);border-top:1px solid #b5c3d1;padding-top:5px">Made by: ______________________________<br>Course: ________ · Instituto Marítimo de Valparaíso</div>`)}
    ${panel(1,"Front cover","",`<div class="cover-title" style="color:#c3cfdb;font-size:22px">Your title here</div><p class="cover-sub">e.g. "The World in 2050", "Valparaíso in the Future", "My Predictions"</p><div class="ttl" style="margin-top:8px"></div><div class="draw" style="flex:1;margin-top:10px">Draw or paste a big picture here</div><div style="margin-top:8px;font-size:10px">My predictions by: ___________________________</div>`)}
   </div></section>`;
  const inside=`<section class="sheet"><div class="tri-cap"><span><b>INSIDE · Por dentro</b> — Paneles 2, 3 y 4: tus tres temas.</span><span>Tríptico de predicciones · 2° Medio</span></div>
   <div class="tri">${topic(2)}${topic(3)}${topic(4)}</div></section>`;
  return outside+inside;
}

document.getElementById("app").innerHTML = modo==="plantilla" ? plantilla() : guia();
</script>
