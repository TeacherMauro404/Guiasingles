<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tríptico de predicciones · Inglés 2° Medio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Plantilla para generar los PDF del proyecto "Tríptico de predicciones" (will).
  Modos (?modo=): guia | plantilla | pauta.  Generar con: node generador/generar_triptico.js
-->
<style>
  :root{--navy:#0E2A47;--bar:#1E5A8A;--blue:#1F5C8B;--blue-soft:#EEF4FA;--gold:#C8912B;--gold-soft:#FBF4E4;
    --ink:#152230;--muted:#5A6B7A;--line:#B8C7D6;--ans:#C0392B;--green:#1B7A3D}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:11.5px;line-height:1.45;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .hdr{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:7px 11px}
  .hdr b{font-size:12.5px;display:block}.hdr small{font-size:9px;color:#c8d7e6}
  .hdr .r{text-align:right}.hdr .r b{color:#E9C579;font-size:11px}
  body.pauta .hdr{background:#5b3f0d}
  .flag{background:var(--ans);color:#fff;font-weight:700;font-size:10.5px;text-align:center;padding:3px;letter-spacing:.05em}
  .namebox{display:grid;grid-template-columns:1.4fr 1fr;border:1.2px solid var(--navy);margin-top:7px;font-size:11px}
  .namebox div{padding:7px 9px}.namebox div+div{border-left:1px solid var(--line)}
  h1{font-family:'Fraunces',Georgia,serif;color:var(--navy);font-size:25px;margin:9px 0 2px;line-height:1.1}
  .obj{color:var(--green);font-weight:700;font-size:10.5px;margin:0}
  .goal{color:var(--blue);font-style:italic;font-size:10.5px;margin:0 0 7px}
  .box{background:var(--gold-soft);border:1px solid var(--gold);padding:7px 10px;margin:6px 0}
  .box h3{margin:0 0 3px;font-size:11.5px;color:var(--navy)}
  .box p{margin:2px 0}
  .act{margin-top:9px;break-inside:avoid;page-break-inside:avoid}
  .bar{background:var(--bar);color:#fff;font-weight:700;font-size:11.5px;padding:4px 9px;display:flex;justify-content:space-between}
  .bar span{font-weight:500;color:#cfe0ef}
  .instr{font-style:italic;font-size:10.3px;color:var(--muted);margin:3px 0 5px}
  table.t{border-collapse:collapse;width:100%}
  table.t td,table.t th{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
  table.t th{background:var(--blue-soft);color:var(--navy);font-size:10.5px}
  .ln{border-bottom:1px solid var(--ink);height:19px}
  .a{color:var(--ans);font-weight:700}
  ol.items{margin:0;padding-left:20px}ol.items li{margin-bottom:5px}
  .scale{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:10.5px;border:1px solid var(--line)}
  .scale div{padding:5px 3px;border-right:1px solid var(--line)}
  .scale div:last-child{border-right:none}
  .scale b{display:block;font-size:13px;color:var(--navy)}
  .bank{background:var(--gold-soft);border:1px solid var(--gold);text-align:center;font-weight:700;color:var(--navy);padding:4px;margin-bottom:5px}
  .diagram{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .fold{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--navy);height:70px}
  .fold div{border-right:1.5px dashed var(--muted);padding:4px;font-size:9.5px;text-align:center;display:flex;flex-direction:column;justify-content:center}
  .fold div:last-child{border-right:none}
  .fold div b{color:var(--navy);font-size:10px}
  .cap{font-size:10px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .model{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--navy)}
  .model > div{padding:7px 8px;border-right:1.5px dashed var(--muted);font-size:10.3px;line-height:1.4}
  .model > div:last-child{border-right:none}
  .model h4{margin:0 0 3px;font-family:'Fraunces',serif;color:var(--navy);font-size:12.5px}
  .model .tag{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
  .check li{list-style:none;margin:3px 0}
  .check li::before{content:"☐  ";font-size:12px}
  .foot{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:3px}

  /* ---------- plantilla horizontal ---------- */
  body.plantilla{font-size:10.5px}
  .tri{display:grid;grid-template-columns:repeat(3,1fr);height:7.6in;border:1px solid #c9d4df}
  .panel{border-right:1.4px dashed #9aa9b8;padding:10px 12px;display:flex;flex-direction:column;position:relative}
  .panel:last-child{border-right:none}
  .panel .pn{position:absolute;top:4px;right:6px;font-size:8px;color:#9aa9b8;font-weight:600}
  .panel .lbl{font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
  .panel .ttl{border-bottom:2px solid var(--navy);height:26px;margin-bottom:6px;font-size:9px;color:#9aa9b8;display:flex;align-items:flex-end}
  .panel .draw{border:1.2px dashed #b5c3d1;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#a5b4c3;font-size:9px;margin:6px 0}
  .panel .lines{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
  .panel .lines div{border-bottom:1px solid #b5c3d1;min-height:22px;max-height:40px;flex:1 1 0}
  .panel .hint{font-size:8.5px;color:#a5b4c3;margin:0 0 2px;font-style:italic}
  .cover-title{font-family:'Fraunces',serif;font-size:26px;color:var(--navy);text-align:center;margin-top:6px;line-height:1.1}
  .cover-sub{text-align:center;color:var(--muted);font-size:10px;margin:4px 0}
  .tri-cap{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px}
  .tri-cap b{color:var(--navy)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const modo=new URLSearchParams(location.search).get("modo")||"guia";
document.body.classList.add(modo);
const K=modo==="pauta";
const hdr=(label,page,total)=>`<div class="hdr"><div><b>INSTITUTO MARÍTIMO DE VALPARAÍSO</b><small>Departamento de Inglés · English Department</small></div>
  <div class="r"><b>${label}</b><small>2° Medio · Nivel A2 · Página ${page}/${total}</small></div></div>${K?'<div class="flag">PAUTA DE CORRECCIÓN — USO EXCLUSIVO DEL DOCENTE</div>':''}`;
const foot=`<div class="foot"><span>Proyecto: Tríptico de predicciones (will)</span><span>Tiempo sugerido: 3 clases de 45 minutos</span></div>`;
const lines=n=>Array.from({length:n},()=>'<div class="ln"></div>').join("");
const ans=(t)=>K?`<span class="a">${t}</span>`:"";

/* ---------- contenido controlado ---------- */
const adverbs=[
 ["People will live on the Moon. (probably)","People will probably live on the Moon."],
 ["Cars will use petrol. (definitely – negative)","Cars definitely won't use petrol."],
 ["Students will study at home. (probably)","Students will probably study at home."],
 ["Robots will cook our food. (definitely)","Robots will definitely cook our food."],
 ["Ships will need a captain on board. (probably – negative)","Ships probably won't need a captain on board."],
 ["I will be famous. (definitely – negative)","I definitely won't be famous."],
];
const complete=[
 ["In ten years, people [will travel] (travel) in electric planes.","will travel"],
 ["I think the sea [will be] (be) cleaner.","will be"],
 ["Students [won't use] (not use) paper books.","won't use"],
 ["Robots [will help] (help) old people at home.","will help"],
 ["I don't think people [will drive] (drive) petrol cars.","will drive"],
 ["My city [will have] (have) more parks and trees.","will have"],
 ["[Will] we live on Mars? — Yes, we [will].","Will · will"],
 ["Summers [will probably be] (probably / be) hotter.","will probably be"],
];
const blank=s=>s.replace(/\[([^\]]+)\]/g,(m,a)=>K?`<span class="a"><u>${a}</u></span>`:"__________");

const RUBRICA=[
 ["Predicciones sobre mí (panel 2)","10 predicciones completas, variadas (edad, casa, trabajo, familia, viajes…) e incluye won't.","8–9 predicciones claras.","5–7 predicciones o muy repetitivas.","Menos de 5 predicciones."],
 ["Predicciones sobre mi amigo/a (panel 3)","10 predicciones sobre el amigo/a con he / she will, coherentes con la entrevista.","8–9 predicciones claras.","5–7 predicciones o muy repetitivas.","Menos de 5 predicciones."],
 ["Mundo y entrevista (paneles 4 y 5)","Tema del mundo con 4+ predicciones y 3+ preguntas Will you…? con respuestas cortas correctas.","Tema con 3 predicciones y 2 preguntas.","Tema o entrevista incompletos.","Falta el tema o la entrevista."],
 ["Uso de will / won't","Usa will + verbo base, won't, preguntas y adverbios (probably, definitely) correctamente casi siempre.","Algunos errores menores.","Errores frecuentes que a veces dificultan la comprensión.","No usa will o los errores impiden comprender."],
 ["Vocabulario y ortografía","Vocabulario variado; casi sin errores de ortografía ni mayúsculas.","Vocabulario adecuado; algunos errores.","Vocabulario limitado; varios errores.","Muchos errores."],
 ["Diseño y estructura","6 paneles completos en el orden correcto, portada atractiva, dibujos y letra legible.","5 paneles completos, diseño ordenado.","4 paneles o diseño simple.","3 o menos paneles o poco legible."],
];
const rubricaHTML=`<table class="t"><tr><th style="width:19%">Criterio</th><th>Excelente (4)</th><th>Bueno (3)</th><th>Suficiente (2)</th><th>Insuficiente (1)</th></tr>
 ${RUBRICA.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
 <tr><td colspan="5" style="text-align:right"><b>PUNTAJE PROYECTO: _______ / 24</b></td></tr></table>`;
const nlines=(n,pre)=>Array.from({length:n},(_,i)=>`<div class="ln" style="display:flex;align-items:flex-end;gap:6px"><span style="font-size:9.5px;color:var(--muted);width:14px">${i+1}.</span>${pre&&i===0?`<span style="font-size:10px;color:var(--muted)">${pre}</span>`:""}</div>`).join("");
const TOT=6;
const H=(n)=>hdr(K?"PAUTA DE CORRECCIÓN":"GUÍA DE PROYECTO",n,TOT);

function guia(){
  const p1=`<section class="sheet">${H(1)}
  ${K?"":`<div class="namebox"><div><b>NOMBRE:</b> ______________________________</div><div><b>CURSO:</b> ______ <b>FECHA:</b> ________</div></div>`}
  <h1>My Predictions Tri-fold</h1>
  <p class="obj">Objetivo: crear un tríptico en inglés con predicciones sobre ti, sobre un amigo/a y sobre el mundo usando will / won't.</p>
  <p class="goal">Goal: make a tri-fold brochure with predictions about you, your friend and the world in 10 years.</p>
  <div class="box"><h3>PARA RECORDAR — Remember</h3>
    <p><b>will + verbo base</b>: <i>I <b>will</b> live near the sea. She <b>will</b> be a chef.</i> · <b>won't</b> (will not): <i>He <b>won't</b> live in Santiago.</i></p>
    <p><b>Preguntas:</b> <i><b>Will</b> you have children? — Yes, I <b>will</b>. / No, I <b>won't</b>.</i> · Opinión: <i><b>I think</b> she will… · <b>I don't think</b> he will…</i> (no: <i>I think … won't</i>)</p>
    <p>Adverbios: <b>will probably / will definitely</b> (después de will) · <b>probably won't / definitely won't</b> (antes de won't) · Tiempo: <i>in ten years, in 2036, one day, soon, next year</i></p>
  </div>
  <div class="act"><div class="bar">¿QUÉ ES UN TRÍPTICO? · How does it work? <span>Lee con atención</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">A tri-fold is one landscape sheet folded in three. It has 6 panels: 3 outside and 3 inside. Panels 2 and 3 have 10 predictions each: about you and about your friend.</b><br>Un tríptico es una hoja tamaño carta horizontal doblada en tres. Tiene 6 paneles: 3 por fuera y 3 por dentro. Los paneles 2 y 3 llevan <b>10 predicciones cada uno</b>: sobre ti y sobre tu amigo/a.</p>
    <div class="diagram">
      <div><div class="cap">OUTSIDE (por fuera)</div><div class="fold"><div><b>Panel 5</b>Interview with my friend</div><div><b>Panel 6</b>Back cover: questions + author</div><div><b>Panel 1</b>Front cover: title + picture</div></div></div>
      <div><div class="cap">INSIDE (por dentro)</div><div class="fold"><div><b>Panel 2</b>Me in 10 years<br>(10 lines)</div><div><b>Panel 3</b>My friend in 10 years<br>(10 lines)</div><div><b>Panel 4</b>The world in 10 years</div></div></div>
    </div>
  </div>
  <div class="act"><div class="bar">1 · WARM-UP: WHAT DO YOU THINK? <span>⏱ 8 min</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Read each prediction. Tick ✓ if you agree or ✗ if you don't. Then write your opinion: I think … will / I don't think … will.</b><br>Lee cada predicción. Marca ✓ si estás de acuerdo o ✗ si no. Luego escribe tu opinión con I think … will / I don't think … will.</p>
    <table class="t"><tr><th style="width:50%">Prediction for the next 10 years</th><th style="width:7%">✓ / ✗</th><th>My opinion</th></tr>
      ${["I will live in another country.","My best friend will be famous.","Robots will teach some classes.","Nobody will use cash.","Ships won't need sailors.","The sea will be cleaner."].map(s=>`<tr><td>${s}</td><td></td><td>${K?'<span class="a" style="font-weight:600">Respuesta personal (I think / I don\'t think … will …)</span>':""}</td></tr>`).join("")}</table>
  </div>
  ${foot}</section>`;

  const p2=`<section class="sheet">${H(2)}
  <div class="act"><div class="bar">2 · HOW SURE ARE YOU? <span>⏱ 8 min · 6 pts</span></div>
    <div class="scale"><div><b>100%</b>will definitely</div><div><b>75%</b>will probably</div><div><b>25%</b>probably won't</div><div><b>0%</b>definitely won't</div></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Rewrite the sentence with the adverb in the correct position.</b><br>Reescribe la oración con el adverbio entre paréntesis en la posición correcta (will probably / probably won't).</p>
    <ol class="items">${adverbs.map(a=>`<li>${a[0]}<br>→ ${K?`<span class="a">${a[1]}</span>`:"_______________________________________________________________"}</li>`).join("")}</ol>
  </div>
  <div class="act"><div class="bar">3 · COMPLETE THE PREDICTIONS <span>⏱ 7 min · 8 pts</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Complete with will / won't + the verb in brackets.</b><br>Completa con will / won't + el verbo entre paréntesis.</p>
    <ol class="items" style="columns:2;column-gap:22px">${complete.map(c=>`<li style="break-inside:avoid">${blank(c[0])}</li>`).join("")}</ol>
  </div>
  ${foot}</section>`;

  const p3=`<section class="sheet">${H(3)}
  <div class="act"><div class="bar">4 · READ A MODEL TRI-FOLD <span>⏱ 12 min · 8 pts</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Read Martina's tri-fold (panel by panel) and answer the questions.</b><br>Lee el tríptico de Martina (panel por panel) y responde las preguntas.</p>
    <div class="model">
      <div><span class="tag">Panel 2 · Me in 10 years</span><h4>My future</h4>1. In ten years, I will be 26 years old. 2. I will live in a flat near the sea. 3. I will probably work as a marine engineer. 4. I will travel on big ships. 5. I will speak English very well. 6. I won't have children yet, but I will have a dog. 7. I won't live in Santiago. 8. I definitely won't smoke. 9. I will drive an electric car. 10. I think I will be very happy!</div>
      <div><span class="tag">Panel 3 · My friend in 10 years</span><h4>Javiera</h4>1. My best friend is Javiera. 2. In ten years, she will be 26 too. 3. She will probably be a chef. 4. She will work in a restaurant in Cerro Alegre. 5. She will cook seafood for tourists. 6. She will live in a flat with two cats. 7. She will travel to Japan to learn new recipes. 8. She won't live in the countryside. 9. She definitely won't stop dancing! 10. We will still be best friends.</div>
      <div><span class="tag">Panel 4 · The world in 10 years</span><h4>A clean planet</h4>More robots will work in shops. Ships will use cleaner energy. Shops definitely won't use plastic bags. Summers will probably be hotter.</div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 5 · Interview</span><h4>Javiera answers</h4><i>Will you live in Chile?</i> — Yes, I will.<br><i>Will you have children?</i> — No, I won't.<br><i>Will you be rich?</i> — Maybe!</div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 6 · Back cover</span><h4>What do YOU think?</h4>Will robots be our friends? Will you live in Valparaíso?<br><i>by Martina Rojas, 2°B</i></div>
      <div style="border-top:1.5px dashed var(--muted)"><span class="tag">Panel 1 · Cover</span><h4>Me, My Friend &amp; the World in 10 Years</h4>My predictions for the future.<br><i>by Martina Rojas, 2°B</i></div>
    </div>
    <p style="margin:6px 0 3px"><b>A.</b> Write T (true) or F (false).</p>
    <ol class="items" style="columns:2;column-gap:22px">
      <li>Martina will live in Santiago. ____ ${ans("F")}</li>
      <li>She will probably be a marine engineer. ____ ${ans("T")}</li>
      <li>Javiera will work in a restaurant. ____ ${ans("T")}</li>
      <li>Javiera will live with two dogs. ____ ${ans("F")}</li>
      <li>Javiera won't have children. ____ ${ans("T")}</li>
    </ol>
    <p style="margin:4px 0 3px"><b>B.</b> Answer the questions.</p>
    <ol class="items">
      <li>What will Javiera cook? → ${K?ans("She will cook seafood for tourists."):"_____________________________________________________"}</li>
      <li>Why will Javiera travel to Japan? → ${K?ans("To learn new recipes."):"_____________________________________________________"}</li>
      <li>How old will Martina be in ten years? → ${K?ans("She will be 26 (years old)."):"_____________________________________________________"}</li>
    </ol>
  </div>
  <div class="act"><div class="bar">5 · INTERVIEW YOUR FRIEND <span>⏱ 10 min · speaking</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Choose a friend. Ask 5 questions with Will you…? and write the short answers (Yes, I will. / No, I won't.).</b><br>Elige a un amigo/a del curso. Hazle 5 preguntas con Will you…? y anota sus respuestas cortas. Esta información se usa en los paneles 3 y 5.</p>
    <p style="margin:0 0 4px;font-size:10.5px"><b>My friend's name:</b> ______________________ &nbsp; Ideas: live in Chile? · have children? · be famous? · travel a lot? · work on a ship? · have pets? · drive a car? · speak English?</p>
    <table class="t"><tr><th style="width:58%">Question (Will you…?)</th><th>Answer</th></tr>
      ${[1,2,3,4,5].map(i=>`<tr><td style="height:22px">${i}. Will you ${K&&i===1?'<span class="a">live in Chile?</span>':""}</td><td>${K&&i===1?'<span class="a">Yes, I will. / No, I won\'t.</span>':""}</td></tr>`).join("")}</table>
  </div>
  ${foot}</section>`;

  const p4=`<section class="sheet">${H(4)}
  <div class="act"><div class="bar">6 · PLAN: 10 PREDICTIONS ABOUT YOU AND YOUR FRIEND <span>⏱ 25 min</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Write 10 predictions about you (I will / I won't) and 10 about your friend (he / she will / won't). Ideas: age · home · city · job · family · pets · travel · car · hobbies · languages · money.</b><br>Escribe 10 predicciones sobre ti y 10 sobre tu amigo/a para dentro de 10 años. Incluye al menos 2 oraciones con won't y 2 con probably / definitely en cada panel.</p>
    ${K?`<div class="box"><h3>Ejemplos de respuesta (personal)</h3><p><span class="a">Me:</span> I will be a ship's officer. I will live in Viña. I probably won't have a car. … <span class="a">Friend:</span> Diego will be a mechanic. He will have three dogs. He definitely won't live in a big city. …</p></div>`:""}
    <table class="t">
      <tr><td style="width:20%;vertical-align:top"><b>Panel 2</b><br>Me in 10 years<br><span style="color:var(--muted);font-size:10px">I will… / I won't…</span></td><td>${nlines(10,"In ten years, I will")}</td></tr>
      <tr><td style="vertical-align:top"><b>Panel 3</b><br>My friend in 10 years<br><span style="color:var(--muted);font-size:10px">Name: __________<br>He / She will…</span></td><td>${nlines(10,"My friend")}</td></tr>
    </table>
  </div>
  ${foot}</section>`;

  const p5=`<section class="sheet">${H(5)}
  <div class="act"><div class="bar">7 · DRAFT THE OTHER PANELS <span>⏱ 15 min</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">Write a draft of the other panels. Check it with your teacher before you copy it onto the template.</b><br>Escribe el borrador de los demás paneles. Revísalo con tu profesor/a antes de pasarlo a la plantilla.</p>
    <table class="t">
      <tr><td style="width:22%"><b>Panel 1 · Cover</b><br><span style="color:var(--muted)">Title + your name</span></td><td>${lines(2)}</td></tr>
      <tr><td><b>Panel 4 · The world in 10 years</b><br>Topic: ___________<br><span style="color:var(--muted);font-size:10px">technology · transport · the sea · my city · school · sports · space</span></td><td>${lines(5)}</td></tr>
      <tr><td><b>Panel 5 · Interview</b><br><span style="color:var(--muted)">3 questions + answers from activity 5</span></td><td>${lines(4)}</td></tr>
      <tr><td><b>Panel 6 · Back cover</b><br><span style="color:var(--muted)">Questions for the reader + author</span></td><td>${lines(3)}</td></tr>
    </table>
  </div>
  <div class="act"><div class="bar">8 · CHECKLIST <span>Antes de entregar</span></div>
    <ul class="check" style="padding-left:4px;columns:2;column-gap:20px;margin:4px 0 6px">
      <li>Panel 2 has 10 predictions about me.</li><li>Panel 3 has 10 predictions about my friend.</li>
      <li>I used will + base verb (will live, not will lives).</li><li>I used won't at least 4 times.</li>
      <li>I used probably / definitely correctly.</li><li>Panel 5 has questions with Will you…?</li>
      <li>My cover has a title, my name and a picture.</li><li>I checked spelling and capital letters.</li>
    </ul>
  </div>
  ${K?`<div class="act"><div class="box"><h3>Orientaciones para revisar el borrador</h3>
      <p>• Paneles 2 y 3: contar 10 predicciones en cada uno; deben usar I will / he / she will y al menos 2 con won't.</p>
      <p>• Verificar: will + verbo base (no <i>will goes</i>, <i>will to go</i>); <i>I don't think … will</i> (no <i>I think … won't</i>); posición del adverbio (<i>will probably</i> / <i>probably won't</i>).</p>
      <p>• Panel 5: preguntas <i>Will you…?</i> con respuestas cortas <i>Yes, I will. / No, I won't.</i> (no <i>Yes, I do</i>).</p>
      <p>• Errores frecuentes: <i>will can</i> → <i>will be able to</i>; <i>There will have</i> → <i>There will be</i>; <i>She will has</i> → <i>She will have</i>.</p></div></div>`:""}
  ${foot}</section>`;

  const p6=`<section class="sheet">${H(6)}
  <div class="act"><div class="bar">RUBRIC · Rúbrica de evaluación del tríptico <span>24 puntos</span></div>
    <p class="instr"><b style="font-style:normal;color:var(--ink)">This is how your tri-fold will be marked. Read it before you start the final version.</b><br>Así se evaluará tu tríptico. Léela antes de empezar la versión final.</p>
    ${rubricaHTML}
    <p style="font-size:10px;color:var(--muted);margin-top:6px">Escala sugerida: 60 % de exigencia (14,4 / 24 puntos = nota 4,0). Tiempo sugerido del proyecto: 3 clases de 45 minutos (1: actividades 1–5 · 2: planificación y borrador · 3: versión final en la plantilla).</p>
  </div>
  ${foot}</section>`;
  return p1+p2+p3+p4+p5+p6;
}

function plantilla(){
  const panel=(n,label,body)=>`<div class="panel"><span class="pn">Panel ${n}</span><div class="lbl">${label}</div>${body}</div>`;
  const numbered=(n)=>`<div class="lines">${Array.from({length:n},(_,i)=>`<div style="display:flex;align-items:flex-end"><span style="font-size:8.5px;color:#9aa9b8;width:13px">${i+1}.</span></div>`).join("")}</div>`;
  const outside=`<section class="sheet"><div class="tri-cap"><span><b>OUTSIDE · Por fuera</b> — Print on both sides (flip on short edge) and fold on the dotted lines. · Imprime por ambos lados (voltear por el borde corto) y dobla por las líneas punteadas.</span><span>Tríptico de predicciones · 2° Medio</span></div>
   <div class="tri">
    ${panel(5,"Interview with my friend",`<div class="ttl">Title: Interview with ________</div><p class="hint">Write 4 questions with Will you…? and your friend's answers.<br>Escribe 4 preguntas con Will you…? y las respuestas de tu amigo/a.</p>
      ${[1,2,3,4].map(i=>`<div style="margin-top:8px;font-size:9.5px;color:#7d8c9b"><b>Q${i}:</b> Will you <span style="display:inline-block;border-bottom:1px solid #b5c3d1;width:70%"></span></div><div style="margin-top:7px;font-size:9.5px;color:#7d8c9b"><b>A:</b> <span style="display:inline-block;border-bottom:1px solid #b5c3d1;width:85%"></span></div>`).join("")}
      <div class="draw" style="flex:1;margin-top:12px">Draw you and your friend in 10 years</div>`)}
    ${panel(6,"Back cover",`<div class="ttl">Title: What do YOU think?</div><p class="hint">Write 2–3 questions with Will…? for your reader.<br>Escribe 2–3 preguntas con Will…? para el lector.</p><div class="lines" style="flex:0 0 auto">${"<div></div>".repeat(6)}</div><div class="draw" style="height:1.5in;margin-top:14px">Did you know…? / Fun fact</div><div style="margin-top:auto;font-size:9px;color:var(--muted);border-top:1px solid #b5c3d1;padding-top:5px">Made by: ______________________________<br>Course: ________ · Instituto Marítimo de Valparaíso</div>`)}
    ${panel(1,"Front cover",`<div class="cover-title" style="color:#c3cfdb;font-size:22px">Your title here</div><p class="cover-sub">e.g. "Me, My Friend &amp; the World in 10 Years"</p><div class="ttl" style="margin-top:8px"></div><div class="draw" style="flex:1;margin-top:10px">Draw or paste a big picture here</div><div style="margin-top:8px;font-size:10px">My predictions by: ___________________________</div>`)}
   </div></section>`;
  const inside=`<section class="sheet"><div class="tri-cap"><span><b>INSIDE · Por dentro</b> — Panel 2: 10 predicciones sobre ti · Panel 3: 10 sobre tu amigo/a · Panel 4: el mundo.</span><span>Tríptico de predicciones · 2° Medio</span></div>
   <div class="tri">
    ${panel(2,"Me in 10 years",`<div class="ttl">Title: My future</div><div class="draw" style="height:1.25in">Draw yourself in 10 years</div><p class="hint">Write 10 predictions about you: I will… / I won't…<br>Escribe 10 predicciones sobre ti.</p>${numbered(10)}`)}
    ${panel(3,"My friend in 10 years",`<div class="ttl">My friend: ____________________</div><div class="draw" style="height:1.25in">Draw your friend in 10 years</div><p class="hint">Write 10 predictions: He / She will… / won't…<br>Escribe 10 predicciones sobre tu amigo/a.</p>${numbered(10)}`)}
    ${panel(4,"The world in 10 years",`<div class="ttl">Title:</div><div class="draw" style="height:1.6in">Draw a picture here</div><p class="hint">Write 4–5 predictions about the world, your city or technology.<br>Escribe 4–5 predicciones sobre el mundo, tu ciudad o la tecnología.</p><div class="lines">${"<div></div>".repeat(9)}</div>`)}
   </div></section>`;
  return outside+inside;
}

document.getElementById("app").innerHTML = modo==="plantilla" ? plantilla() : guia();
</script>
</body>
